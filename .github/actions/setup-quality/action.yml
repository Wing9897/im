name: Setup quality environment
description: Node, optional Python/uv, and locked dependency install for quality jobs

inputs:
  python:
    description: Install uv, Python 3.11, and the locked Python extra
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm

    - uses: astral-sh/setup-uv@v7
      if: ${{ inputs.python == 'true' }}
      with:
        enable-cache: true
        activate-environment: true

    - name: Install Python 3.11
      if: ${{ inputs.python == 'true' }}
      shell: bash
      run: uv python install 3.11

    - name: Install dependencies
      shell: bash
      run: |
        if [[ "${{ inputs.python }}" == "true" ]]; then
          uv sync --extra dev --locked
        fi
        npm ci
