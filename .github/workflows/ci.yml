name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# PR / main: quality + build only. To publish: Actions → Release → Run workflow (auto tag + push).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read
