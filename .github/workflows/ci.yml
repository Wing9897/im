name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # Tag builds also publish Desktop artifacts + GitHub Release + GHCR image
  # (see package / release / container jobs).
  # Example: git tag v0.1.0-beta.3 && git push origin v0.1.0-beta.3

env:
  # Unsigned Desktop builds in CI unless repo secrets provide signing material.
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          activate-environment: true

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv sync --extra dev --locked
          npm ci

      - name: Run quality gates
        run: npm run check

      - name: Build web and desktop
        run: npm run build

      - name: Build bundled server sidecar
        run: uv run python scripts/build_server_sidecar.py

      - name: Verify bundled server exists
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            server="desktop/server-runtime/intelligence-monitor-server/intelligence-monitor-server.exe"
          else
            server="desktop/server-runtime/intelligence-monitor-server/intelligence-monitor-server"
          fi
          test -f "$server" || { echo "Missing bundled server: $server"; exit 1; }

  package:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: dist:win
            artifact: windows-desktop
          - os: macos-latest
            dist: dist:mac
            artifact: macos-desktop
          - os: ubuntu-latest
            dist: dist:linux
            artifact: linux-desktop
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$tag" != "$version" ]]; then
            echo "Tag v$tag does not match VERSION ($version)" >&2
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          activate-environment: true

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Install Linux packaging deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm

      - name: Install dependencies
        run: |
          uv sync --extra dev --locked
          npm ci

      - name: Build and verify Desktop package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm run ${{ matrix.dist }}
          npm run verify:desktop:full

      - name: Upload Desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.yml
            desktop/release/*.yaml
            desktop/release/*.blockmap
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches VERSION
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$tag" != "$version" ]]; then
            echo "Tag v$tag does not match VERSION ($version)" >&2
            exit 1
          fi

      - name: Download Desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "*-${{ github.sha }}"
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          body: |
            Desktop installers for **${{ github.ref_name }}**.

            See [`CHANGELOG.md`](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) for release notes.
          files: |
            release-assets/**/*.exe
            release-assets/**/*.dmg
            release-assets/**/*.zip
            release-assets/**/*.AppImage
            release-assets/**/*.deb
            release-assets/**/*.yml
            release-assets/**/*.yaml
            release-assets/**/*.blockmap
          fail_on_unmatched_files: false

  container:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Image name (lowercase)
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=buildcache,enable=false

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
