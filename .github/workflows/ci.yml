name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # Tag builds publish Desktop + CLI artifacts to GitHub Release + GHCR image
  # (see desktop / package / release / container jobs).
  # Example: git tag v0.1.0-beta.6 && git push origin v0.1.0-beta.6

env:
  # Unsigned Desktop builds in CI unless repo secrets provide signing material.
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  # PR / push core gate: Ubuntu only (lint, typecheck, i18n, OpenAPI, full tests).
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          activate-environment: true

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv sync --extra dev --locked
          npm ci

      - name: Run quality gates
        run: npm run check

      - name: Build web and desktop
        run: npm run build

  # Path gate for Desktop smoke. Unrelated push/PR → relevant=false so the whole
  # `desktop` matrix is Skipped (not a green empty run). Tag / workflow_dispatch always relevant.
  desktop-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.paths.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect Desktop-related path changes
        id: paths
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" "$head" | grep -E '^(desktop/|scripts/build_server_sidecar\.py|scripts/package_cli\.py|package\.json|package-lock\.json|web/)' >/dev/null; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  # Symmetric Desktop smoke on Windows / macOS / Linux when Desktop/web paths change,
  # on v* tags, or via manual dispatch. Same job name + matrix — no Windows-only green light.
  # Full installers + CLI zips remain the separate `package` job (tag / workflow_dispatch only).
  desktop:
    needs: desktop-paths
    if: needs.desktop-paths.outputs.relevant == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          activate-environment: true

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv sync --extra dev --locked
          npm ci

      - name: Build web and desktop
        run: npm run build

      - name: Desktop fast verify (paths + vitest)
        run: npm run verify:desktop:fast

      - name: Build server sidecar (PyInstaller, native OS)
        run: uv run python scripts/build_server_sidecar.py

      - name: Verify bundled server exists
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            server="desktop/server-runtime/intelligence-monitor-server/intelligence-monitor-server.exe"
          else
            server="desktop/server-runtime/intelligence-monitor-server/intelligence-monitor-server"
          fi
          test -f "$server" || { echo "Missing bundled server: $server"; exit 1; }
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            chmod +x "$server"
          fi
          echo "Found sidecar: $server"

      - name: Sidecar startup smoke (tzdata / sse_starlette)
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            server="desktop/server-runtime/intelligence-monitor-server/intelligence-monitor-server.exe"
          else
            server="desktop/server-runtime/intelligence-monitor-server/intelligence-monitor-server"
            chmod +x "$server"
          fi
          export INTELLIGENCE_MONITOR_DATA_DIR="${RUNNER_TEMP}/im-sidecar-smoke"
          export INTELLIGENCE_MONITOR_HOST=127.0.0.1
          mkdir -p "$INTELLIGENCE_MONITOR_DATA_DIR"
          "$server" &
          pid=$!
          cleanup() { kill "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:18820/api/v1/health" >/tmp/im-health.json; then
              grep -q '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/im-health.json
              exit 0
            fi
            sleep 2
          done
          echo "Sidecar failed to become healthy within 120s" >&2
          exit 1

  # Desktop installers + CLI zip (win/mac/linux) on tag or manual dispatch only.
  # Same trigger for all three OS — no platform-specific gate.
  package:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: dist:win
            artifact: windows-release
            expect_desktop: "*.exe"
            expect_cli: "intelligence-monitor-cli-windows-*.zip"
          - os: macos-latest
            dist: dist:mac
            artifact: macos-release
            expect_desktop: "*.dmg"
            expect_cli: "intelligence-monitor-cli-macos-*.zip"
          - os: ubuntu-latest
            dist: dist:linux
            artifact: linux-release
            expect_desktop: "*.AppImage"
            expect_cli: "intelligence-monitor-cli-linux-*.zip"
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$tag" != "$version" ]]; then
            echo "Tag v$tag does not match VERSION ($version)" >&2
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          activate-environment: true

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Install Linux packaging deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm

      - name: Install dependencies
        run: |
          uv sync --extra dev --locked
          npm ci

      - name: Build Desktop package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run ${{ matrix.dist }}

      - name: Verify Desktop package
        run: npm run verify:desktop:full

      - name: Package CLI zip (same PyInstaller onedir as sidecar)
        run: npm run package:cli

      - name: Assert Desktop + CLI artifacts exist
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          desktop=(desktop/release/${{ matrix.expect_desktop }})
          cli=(dist/cli/${{ matrix.expect_cli }})
          echo "Desktop matches: ${desktop[*]:-none}"
          echo "CLI matches: ${cli[*]:-none}"
          if [[ ${#desktop[@]} -lt 1 ]]; then
            echo "Missing Desktop artifact matching desktop/release/${{ matrix.expect_desktop }}" >&2
            ls -la desktop/release || true
            exit 1
          fi
          if [[ ${#cli[@]} -lt 1 ]]; then
            echo "Missing CLI zip matching dist/cli/${{ matrix.expect_cli }}" >&2
            ls -la dist/cli || true
            exit 1
          fi

      - name: Upload Desktop + CLI artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.yml
            desktop/release/*.yaml
            desktop/release/*.blockmap
            dist/cli/intelligence-monitor-cli-*.zip
          if-no-files-found: error

  # On v* tags only: create GitHub Release with Desktop + CLI from all three package legs.
  # workflow_dispatch builds artifacts but does NOT create a Release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches VERSION
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$tag" != "$version" ]]; then
            echo "Tag v$tag does not match VERSION ($version)" >&2
            exit 1
          fi

      - name: Download Desktop + CLI artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "*-release-${{ github.sha }}"
          path: release-assets
          merge-multiple: true

      - name: Stage and assert Release attachments
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staged
          # Flatten whatever layout download-artifact used so softprops globs cannot miss.
          while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            # Avoid collisions across platforms (mac zip vs cli zip share .zip).
            if [[ -e "staged/$base" ]]; then
              parent="$(basename "$(dirname "$f")")"
              base="${parent}-${base}"
            fi
            cp "$f" "staged/$base"
          done < <(find release-assets -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' \
               -o -name '*.deb' -o -name '*.yml' -o -name '*.yaml' -o -name '*.blockmap' \) \
            -print0)

          echo "Staged files:"
          ls -la staged

          need_fail=0
          require_name() {
            local pattern="$1"
            local hit
            hit="$(find staged -maxdepth 1 -type f -name "$pattern" | head -n 1 || true)"
            if [[ -z "$hit" ]]; then
              echo "MISSING required Release attachment: $pattern" >&2
              need_fail=1
            else
              echo "OK: $pattern → $hit"
            fi
          }
          require_name 'Intelligence Monitor Setup *.exe'
          require_name '*.dmg'
          require_name '*.AppImage'
          require_name 'intelligence-monitor-cli-windows-*.zip'
          require_name 'intelligence-monitor-cli-macos-*.zip'
          require_name 'intelligence-monitor-cli-linux-*.zip'
          if [[ "$need_fail" -ne 0 ]]; then
            echo "Refusing to publish an empty or incomplete GitHub Release." >&2
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          fail_on_unmatched_files: true
          body: |
            Desktop installers + headless CLI for **${{ github.ref_name }}**.

            **Desktop (first-class):** Windows NSIS (`.exe`), macOS DMG/zip, Linux AppImage/deb.

            **CLI:** `intelligence-monitor-cli-<os>-<arch>.zip` — PyInstaller onedir for the same
            entry as `python -m server` / `intelligence-monitor` (no Electron). Unpack and run
            `intelligence-monitor-server` (`.exe` on Windows).

            Docker/Web image is published to GHCR on the same tag (or via manual workflow_dispatch).

            See [`CHANGELOG.md`](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) for release notes.
          files: |
            staged/*

  # Docker image: tag or manual only (not every main push). Healthcheck lives in Dockerfile.
  container:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Image name (lowercase)
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=buildcache,enable=false

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy smoke (healthcheck)
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.name }}"
          # Prefer the just-built sha tag for a deterministic smoke.
          tag="sha-${GITHUB_SHA}"
          docker pull "${image}:${tag}"
          cid="$(docker run -d -p 18820:18820 -e INTELLIGENCE_MONITOR_HOST=0.0.0.0 "${image}:${tag}")"
          cleanup() { docker rm -f "$cid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for i in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:18820/api/v1/health" | grep -q '"status"[[:space:]]*:[[:space:]]*"ok"'; then
              exit 0
            fi
            sleep 3
          done
          echo "Container failed health smoke" >&2
          docker logs "$cid" || true
          exit 1
