name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# PR / main: quality only. Green CI on main starts Release (auto tag + GitHub Release).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read
