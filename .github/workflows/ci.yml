name: CI

on:
  pull_request:
  workflow_dispatch:

# PRs: quality only. Push to main runs Release (quality + tag + 3-platform Desktop).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read
