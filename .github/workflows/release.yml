name: Release

run-name: ${{ github.event_name == 'workflow_run' && format('main {0}', github.event.workflow_run.head_sha) || 'manual' }}

# push main → CI quality green → this workflow: tag + package + GitHub Release + GHCR
# workflow_dispatch still works (runs quality first). Do not tag locally.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "留空 = 從最新 tag bump。或填 SemVer（不要 v 前綴）"
        required: false
        type: string

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  quality:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  version:
    needs: [quality]
    if: |
      always() && (
        (github.event_name == 'workflow_dispatch' && needs.quality.result == 'success') ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag_name: ${{ steps.bump.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Generate tag version
        id: bump
        env:
          INPUT_VERSION: ${{ github.event.inputs.version || '' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          if [[ -n "${INPUT_VERSION}" ]]; then
            version="${INPUT_VERSION#v}"
          else
            version="$(python3 scripts/bump_version.py --from-tags --print-only)"
          fi
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists, appending run number."
            version="${version}-update.${GITHUB_RUN_NUMBER}"
            tag="v${version}"
          else
            echo "Tag ${tag} does not exist, creating it."
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$ ]]; then
            echo "Invalid SemVer: ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${tag}" >> "$GITHUB_OUTPUT"
          echo "RELEASE_VERSION=${version} (tag ${tag}) @ ${RELEASE_SHA}"

  tag:
    needs: [version]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Create and push tag
        env:
          TAG: ${{ needs.version.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${TAG}" "${RELEASE_SHA}"
          git push origin "refs/tags/${TAG}"
          echo "Pushed ${TAG} @ ${RELEASE_SHA}"

  package:
    needs: [version, tag]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: dist:win
            artifact: windows-release
            expect_desktop: "*.exe"
          - os: macos-latest
            dist: dist:mac
            artifact: macos-release
            expect_desktop: "*.dmg"
          - os: ubuntu-latest
            dist: dist:linux
            artifact: linux-release
            expect_desktop: "*.AppImage"
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          activate-environment: true

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Install Linux packaging deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm

      - name: Install dependencies
        run: |
          uv sync --extra dev --locked
          npm ci

      - name: Apply release version (workspace only)
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$RELEASE_VERSION" > VERSION
          node scripts/sync-version.mjs

      - name: Build Desktop package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run ${{ matrix.dist }}

      - name: Verify Desktop package
        run: npm run verify:desktop:full

      - name: Assert Desktop artifacts exist
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          desktop=(desktop/release/${{ matrix.expect_desktop }})
          echo "Desktop matches: ${desktop[*]:-none}"
          if [[ ${#desktop[@]} -lt 1 ]]; then
            echo "Missing Desktop artifact matching desktop/release/${{ matrix.expect_desktop }}" >&2
            ls -la desktop/release || true
            exit 1
          fi

      - name: Upload Desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-${{ env.RELEASE_SHA }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.yml
            desktop/release/*.yaml
            desktop/release/*.blockmap
          if-no-files-found: error

  release:
    needs: [package, version, tag]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Download Desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "*-release-${{ env.RELEASE_SHA }}"
          path: release-assets
          merge-multiple: true

      - name: Stage and assert Release attachments
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staged
          while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            if [[ -e "staged/$base" ]]; then
              parent="$(basename "$(dirname "$f")")"
              base="${parent}-${base}"
            fi
            cp "$f" "staged/$base"
          done < <(find release-assets -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' \
               -o -name '*.deb' -o -name '*.yml' -o -name '*.yaml' -o -name '*.blockmap' \) \
            -print0)

          echo "Staged files:"
          ls -la staged

          need_fail=0
          require_name() {
            local pattern="$1"
            local hit
            hit="$(find staged -maxdepth 1 -type f -name "$pattern" | head -n 1 || true)"
            if [[ -z "$hit" ]]; then
              echo "MISSING required Release attachment: $pattern" >&2
              need_fail=1
            else
              echo "OK: $pattern → $hit"
            fi
          }
          require_name 'Intelligence Monitor Setup *.exe'
          require_name '*.dmg'
          require_name '*.AppImage'
          if [[ "$need_fail" -ne 0 ]]; then
            echo "Refusing to publish an incomplete GitHub Release." >&2
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag_name }}
          name: ${{ needs.version.outputs.tag_name }}
          target_commitish: ${{ env.RELEASE_SHA }}
          body: |
            Automated release **${{ needs.version.outputs.tag_name }}** from `${{ env.RELEASE_SHA }}`.

            Desktop installers are attached. CLI is source: clone this tag, `uv sync --locked`, then `uv run python -m server` (or `intelligence-monitor`). Headless container: GHCR.
          prerelease: ${{ contains(needs.version.outputs.tag_name, 'beta') || contains(needs.version.outputs.tag_name, 'alpha') || contains(needs.version.outputs.tag_name, 'rc') || contains(needs.version.outputs.tag_name, 'update') }}
          fail_on_unmatched_files: true
          files: |
            staged/*

  container:
    needs: [version, tag]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Apply release version (workspace only)
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$RELEASE_VERSION" > VERSION
          node scripts/sync-version.mjs

      - name: Image name (lowercase)
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.version.outputs.tag_name }}
            type=raw,value=sha-${{ env.RELEASE_SHA }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy smoke (healthcheck)
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.name }}"
          tag="sha-${{ env.RELEASE_SHA }}"
          docker pull "${image}:${tag}"
          cid="$(docker run -d -p 18820:18820 -e INTELLIGENCE_MONITOR_HOST=0.0.0.0 "${image}:${tag}")"
          cleanup() { docker rm -f "$cid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for i in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:18820/api/v1/health" | grep -q '"status"[[:space:]]*:[[:space:]]*"ok"'; then
              exit 0
            fi
            sleep 3
          done
          echo "Container failed health smoke" >&2
          docker logs "$cid" || true
          exit 1
