name: Release

# Default shipping path: git push origin main
#   quality → git tag + push (bump from latest tag; version input unused)
#   → one Vite web/dist → win/mac/linux Desktop → GitHub Release + GHCR
# CLI is source (clone the tag). No skipped jobs on this path.
# web/dist is staged as a GitHub Release asset (not Actions artifacts — private-repo quota).
# workflow_dispatch is an optional escape hatch only — do not ship via `gh workflow run`.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "可選逃生口。留空 = 從最新 tag bump（與 push main 相同）。或填 SemVer（不要 v 前綴）"
        required: false
        type: string

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  tag:
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag_name: ${{ steps.check.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Generate tag version
        id: check
        env:
          INPUT_VERSION: ${{ github.event.inputs.version || '' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          if [[ -n "${INPUT_VERSION}" ]]; then
            version="${INPUT_VERSION#v}"
          else
            version="$(python3 scripts/bump_version.py --from-tags --print-only)"
          fi
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists, appending run number."
            version="${version}-update.${GITHUB_RUN_NUMBER}"
            tag="v${version}"
          else
            echo "Tag ${tag} does not exist, creating it."
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$ ]]; then
            echo "Invalid SemVer: ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${tag}" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          TAG: ${{ steps.check.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${TAG}"
          echo "Pushed ${TAG} @ ${GITHUB_SHA}"

      - name: Create GitHub Release
        env:
          TAG: ${{ steps.check.outputs.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ contains(steps.check.outputs.tag_name, 'beta') || contains(steps.check.outputs.tag_name, 'alpha') || contains(steps.check.outputs.tag_name, 'rc') || contains(steps.check.outputs.tag_name, 'update') }}
        shell: bash
        run: |
          set -euo pipefail
          retry() {
            local attempt=1 max=8 delay=15
            while true; do
              if "$@"; then
                return 0
              fi
              if (( attempt >= max )); then
                echo "failed after ${max} attempts: $*" >&2
                return 1
              fi
              echo "attempt ${attempt}/${max} failed; sleeping ${delay}s then retry (api.github.com flake)" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$(( delay < 60 ? delay * 2 : 60 ))
            done
          }
          notes="Automated release **${TAG}** from ${GITHUB_SHA}. Desktop installers (Windows / macOS / Linux) attach as each platform job finishes. CLI is source: clone this tag, uv sync --locked, then uv run python -m server. Container: GHCR."
          extra=()
          if [[ "${PRERELEASE}" == "true" ]]; then
            extra+=(--prerelease)
          fi
          # gh, not action-gh-release: that action's Octokit uses a 10s api.github.com timeout.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists"
          else
            retry gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes "$notes" "${extra[@]}"
          fi

  web_dist:
    needs: [tag]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply release version (workspace only)
        env:
          RELEASE_VERSION: ${{ needs.tag.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$RELEASE_VERSION" > VERSION
          node scripts/sync-version.mjs

      - name: Build web dist
        run: npm run build:web

      - name: Stage web dist on GitHub Release
        env:
          TAG: ${{ needs.tag.outputs.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f web/dist/index.html ]]; then
            echo "Expected web/dist/index.html after build:web" >&2
            ls -la web/dist || true
            exit 1
          fi
          if [[ ! -d web/dist/assets ]]; then
            echo "Expected web/dist/assets after build:web" >&2
            ls -la web/dist || true
            exit 1
          fi
          tar -C web/dist -czf web-dist.tar.gz .
          retry() {
            local attempt=1 max=8 delay=15
            while true; do
              if "$@"; then
                return 0
              fi
              if (( attempt >= max )); then
                echo "failed after ${max} attempts: $*" >&2
                return 1
              fi
              echo "attempt ${attempt}/${max} failed; sleeping ${delay}s then retry (api.github.com flake)" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$(( delay < 60 ? delay * 2 : 60 ))
            done
          }
          retry gh release upload "$TAG" web-dist.tar.gz --clobber
          echo "Staged web-dist.tar.gz on ${TAG}"

  package:
    needs: [tag, web_dist]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: dist:win:native
            expect_desktop: "*.exe"
          - os: macos-latest
            dist: dist:mac:native
            expect_desktop: "*.dmg"
          - os: ubuntu-latest
            dist: dist:linux:native
            expect_desktop: "*.AppImage"
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          activate-environment: true

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Install Linux packaging deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm

      - name: Install dependencies
        run: |
          uv sync --extra dev --locked
          npm ci

      - name: Apply release version (workspace only)
        env:
          RELEASE_VERSION: ${{ needs.tag.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$RELEASE_VERSION" > VERSION
          node scripts/sync-version.mjs

      - name: Download shared web dist
        env:
          TAG: ${{ needs.tag.outputs.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p web/dist
          retry() {
            local attempt=1 max=8 delay=15
            while true; do
              if "$@"; then
                return 0
              fi
              if (( attempt >= max )); then
                echo "failed after ${max} attempts: $*" >&2
                return 1
              fi
              echo "attempt ${attempt}/${max} failed; sleeping ${delay}s then retry (api.github.com flake)" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$(( delay < 60 ? delay * 2 : 60 ))
            done
          }
          retry gh release download "$TAG" --pattern web-dist.tar.gz --clobber
          tar -xzf web-dist.tar.gz -C web/dist
          rm -f web-dist.tar.gz
          if [[ ! -f web/dist/index.html ]]; then
            echo "Expected web/dist/index.html after downloading Release asset web-dist.tar.gz" >&2
            ls -la web/dist || true
            exit 1
          fi
          if [[ ! -d web/dist/assets ]]; then
            echo "Expected web/dist/assets directory after downloading Release asset web-dist.tar.gz" >&2
            ls -la web/dist || true
            exit 1
          fi

      - name: Build Desktop package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run ${{ matrix.dist }}

      - name: Verify Desktop package
        run: npm run verify:desktop:full

      - name: Assert Desktop artifacts exist
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          desktop=(desktop/release/${{ matrix.expect_desktop }})
          echo "Desktop matches: ${desktop[*]:-none}"
          if [[ ${#desktop[@]} -lt 1 ]]; then
            echo "Missing Desktop artifact matching desktop/release/${{ matrix.expect_desktop }}" >&2
            ls -la desktop/release || true
            exit 1
          fi

      - name: Upload to GitHub Release
        env:
          TAG: ${{ needs.tag.outputs.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.yml
            desktop/release/*.yaml
            desktop/release/*.blockmap
          )
          if [[ ${#files[@]} -lt 1 ]]; then
            echo "No Desktop artifacts to upload" >&2
            ls -la desktop/release || true
            exit 1
          fi
          echo "Uploading ${#files[@]} files to ${TAG}:"
          printf '  %s\n' "${files[@]}"
          retry() {
            local attempt=1 max=8 delay=15
            while true; do
              if "$@"; then
                return 0
              fi
              if (( attempt >= max )); then
                echo "failed after ${max} attempts: $*" >&2
                return 1
              fi
              echo "Upload attempt ${attempt}/${max} failed; sleeping ${delay}s then retry (api.github.com flake)" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$(( delay < 60 ? delay * 2 : 60 ))
            done
          }
          # gh, not action-gh-release: that action's Octokit uses a 10s api.github.com timeout.
          retry gh release upload "$TAG" "${files[@]}" --clobber
          echo "Uploaded ${#files[@]} assets to ${TAG}"

  release:
    needs: [package, tag]
    if: always() && needs.tag.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete staged web-dist.tar.gz
        if: needs.package.result == 'success'
        env:
          TAG: ${{ needs.tag.outputs.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: gh release delete-asset "$TAG" web-dist.tar.gz --yes || true

      - name: Keep web-dist for failed-job reruns
        if: needs.package.result != 'success'
        env:
          TAG: ${{ needs.tag.outputs.tag_name }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        shell: bash
        run: |
          echo "package result=${PACKAGE_RESULT}. Leaving web-dist.tar.gz on ${TAG} so Re-run failed jobs can still download it." >&2
          echo "Do not dispatch a new Release; re-run the failed package job on this run." >&2
          exit 1

      - name: Assert Release has three Desktop installers
        if: needs.package.result == 'success'
        env:
          TAG: ${{ needs.tag.outputs.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          echo "Release assets:"
          echo "$assets"
          need_fail=0
          require() {
            local pattern="$1"
            if ! echo "$assets" | grep -E -q "$pattern"; then
              echo "MISSING required Release attachment: $pattern" >&2
              need_fail=1
            else
              echo "OK: $pattern"
            fi
          }
          # GitHub sanitizes spaces in asset names to dots.
          require 'Setup.+\.exe$'
          require '\.dmg$'
          require '\.AppImage$'
          if [[ "$need_fail" -ne 0 ]]; then
            echo "Refusing an incomplete GitHub Release." >&2
            exit 1
          fi

  container:
    needs: [tag]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Apply release version (workspace only)
        env:
          RELEASE_VERSION: ${{ needs.tag.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$RELEASE_VERSION" > VERSION
          node scripts/sync-version.mjs

      - name: Image name (lowercase)
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.tag.outputs.tag_name }}
            type=raw,value=sha-${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy smoke (healthcheck)
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.name }}"
          tag="sha-${{ github.sha }}"
          docker pull "${image}:${tag}"
          cid="$(docker run -d -p 18820:18820 -e INTELLIGENCE_MONITOR_HOST=0.0.0.0 "${image}:${tag}")"
          cleanup() { docker rm -f "$cid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for i in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:18820/api/v1/health" | grep -q '"status"[[:space:]]*:[[:space:]]*"ok"'; then
              exit 0
            fi
            sleep 3
          done
          echo "Container failed health smoke" >&2
          docker logs "$cid" || true
          exit 1
