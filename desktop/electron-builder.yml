appId: com.intelligencemonitor.desktop
productName: Intelligence Monitor
directories:
  buildResources: resources
  output: release
files:
  - dist/**/*
  - resources/**/*
extraResources:
  - from: ../web/dist
    to: web-dist
  - from: server-runtime
    to: server-runtime
# Open .ics with this app → calendar import dialog (user_events + optional task).
fileAssociations:
  - ext: ics
    name: iCalendar
    description: iCalendar Event
    mimeType: text/calendar
    role: Editor
# Deep link: intelligencemonitor://calendar/import?url=… or title+start
protocols:
  - name: Intelligence Monitor
    schemes:
      - intelligencemonitor
# Placeholder ICO; replace with multi-res assets before store release.
icon: resources/icon.ico
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico
nsis:
  oneClick: false
  perMachine: false
  deleteAppDataOnUninstall: false
mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  # CI ships unsigned builds unless CSC_* secrets are configured.
  identity: null
  icon: resources/icon.ico
  extendInfo:
    CFBundleDocumentTypes:
      - CFBundleTypeExtensions: [ics]
        CFBundleTypeName: iCalendar
        CFBundleTypeRole: Editor
        LSItemContentTypes: [public.calendar-event]
linux:
  target:
    - AppImage
    - deb
  category: Office
  icon: resources/icon.ico
  mimeTypes:
    - text/calendar
    - x-scheme-handler/intelligencemonitor
