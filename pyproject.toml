[project]
name = "intelligence-monitor-server"
version = "0.1.0-beta.8"
description = "Intelligence Monitor - Python FastAPI Server"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "aiosqlite==0.19.0",
    "aiohttp==3.11.11",
    "aiomqtt==2.3.0",
    "apscheduler==3.11.0",
    "sse-starlette==3.0.3",
    "pydantic==2.12.5",
    "python-dateutil==2.9.0.post0",
    "telethon==1.40.0",
    "cryptg==0.6.0",
    "feedparser==6.0.12",
    "imap-tools==1.13.0",
    "geopy==2.4.1",
    "cryptography==49.0.0",
    "argon2-cffi==25.1.0",
    "icalendar==7.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "pytest-asyncio==1.3.0",
    "hypothesis==6.148.8",
    "httpx==0.28.1",
    "ruff==0.14.10",
    "pytest-cov==7.1.0",
    "pyinstaller==6.16.0",
]

[project.scripts]
intelligence-monitor = "server.__main__:main"

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["server*"]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "traceability(marker): links a generated test to its feature and numbered property",
]

[tool.pyright]
include = ["server", "scripts"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"server/main.py" = ["E402"]
"server/__main__.py" = ["E402"]

[tool.uv]
# App repo, not a library — skip setuptools rebuild on every `uv run` in dev.
package = false
